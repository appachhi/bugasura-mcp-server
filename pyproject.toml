# This project is run in place via `python server.py` — it is not built or
# distributed as a pip package. The [project] section below is kept for
# dependency metadata only (install with `pip install -r requirements.txt`).
# Setuptools is explicitly told there are no packages or modules to install.

[project]
name = "bugasura-mcp-server"
version = "3.1.0"
description = "MCP server for Bugasura/Appachhi API (run in place, not installable)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.10,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.35.0",
    "starlette>=1.0.1",
]

[tool.setuptools]
# Flat layout: no package to discover and install.
py-modules = []
packages = []

[dependency-groups]
dev = [
    "pytest>=8",
]
